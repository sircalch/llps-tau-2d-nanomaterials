name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/ -v

    - name: Verify imports and core module loading
      run: |
        python -c "
from src.thermodynamics.material_parameters import (
    calculate_m_tilde_max, compute_thermodynamic_activity,
    adsorption_equilibrium_dimensionless, TAU_K18_SYSTEM
)
from src.thermodynamics.flory_huggins_voorn_overbeek import FloryHugginsVoornOverbeek
from src.thermodynamics.cahn_hilliard_wetting import CahnHilliardWetting
from src.kinetics.condensate_aging_kinetics import CondensateAgingKinetics
import pandas as pd, numpy as np, scipy, matplotlib
print('All imports OK. pandas version:', pd.__version__)
fh = FloryHugginsVoornOverbeek()
tc = fh.calculate_apparent_cloud_point(a_s_nm_inv=0.0, phi_total=0.095)
assert 14.5 < tc < 16.5, f'Cloud point {tc:.2f} out of expected range'
print(f'Cloud point check passed: T_cloud = {tc:.2f} C')
"

  # Note: Full figure generation (Sobol N_base=512, 5120 evaluations) runs locally
  # via: python run_pipeline.py
  # CI only runs the fast unit test suite and import verification to keep build times < 5 min.
